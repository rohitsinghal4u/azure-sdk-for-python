# Generated fork-only test harness. Production post-processing jobs are copied unchanged.
name: Live issue handoff validation
run-name: "Handoff gate ${{ inputs.mode }} for issue #${{ inputs.issue_number }}"
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Number of the dedicated T1 validation issue"
        required: true
        type: string
      mode:
        description: "Controlled post-processing scenario"
        required: true
        type: choice
        options: [success, owner-failure, mutation-failure, staged]
permissions: {}
env:
  GH_AW_SAFE_OUTPUTS_STAGED: ${{ inputs.mode == 'staged' && 'true' || 'false' }}
jobs:
  activation:
    runs-on: ubuntu-latest
    outputs:
      setup-trace-id: ""
      setup-parent-span-id: ""
      setup-span-id: ""
      comment_id: ""
    steps:
      - run: echo "Controlled fork-only context; no live triage model is simulated."
  agent:
    runs-on: ubuntu-latest
    permissions:
      issues: read
    outputs:
      output_types: ${{ steps.fixture.outputs.types }}
      aic: "0"
      ambient_context: "{}"
      effective_tokens: "0"
      model: "controlled-fixture"
    steps:
      - name: Produce controlled buffered triage outputs
        id: fixture
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TEST_ISSUE_NUMBER: ${{ inputs.issue_number }}
          TEST_MODE: ${{ inputs.mode }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            if (context.repo.owner !== 'rohitsinghal4u' || context.repo.repo !== 'azure-sdk-for-python') {
              throw new Error('This harness can run only in the designated personal fork');
            }
            const raw = process.env.TEST_ISSUE_NUMBER;
            const number = Number(raw);
            if (!/^[1-9]\d*$/.test(raw) || !Number.isSafeInteger(number)) {
              throw new Error('Invalid validation issue number');
            }
            const mode = process.env.TEST_MODE;
            if (!['success', 'owner-failure', 'mutation-failure', 'staged'].includes(mode)) {
              throw new Error('Invalid validation mode');
            }
            const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: number });
            if (issue.title !== '[gate-test 20260928] T1 Applied triage handoff' ||
                issue.user.login !== 'rohitsinghal4u' || issue.pull_request ||
                issue.state !== 'open' || issue.locked ||
                issue.labels.length !== 1 || issue.labels[0].name !== 'needs-triage') {
              throw new Error('The dedicated validation issue must be open, unlocked, and reset to needs-triage');
            }
            const output = {
              items: [
                { type: 'dispatch_workflow', workflow_name: 'issue-investigation', inputs: { issue_number: String(number) } },
                { type: 'remove_labels', item_number: number, labels: ['needs-triage'] },
                { type: 'add_labels', item_number: number, labels: ['customer-reported', 'KeyVault', 'Client'] },
                { type: 'add_comment', item_number: mode === 'mutation-failure' ? 0 : number,
                  body: '## Agentic Issue Triage\n\nManual post-processing test: the controller supplies the triage labels and this analysis for a missing-information fixture.' },
                { type: 'mention_owners', owners: mode === 'owner-failure' ? '' : 'rohitsinghal4u',
                  message: 'Manual validation owner routing completed.' }
              ],
              errors: []
            };
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, 'agent_output.json'), JSON.stringify(output));
            core.setOutput('types', JSON.stringify(output.items.map(item => item.type)));
      - name: Upload controlled outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent
          path: ${{ runner.temp }}/agent_output.json
  detection:
    needs: [agent]
    runs-on: ubuntu-latest
    outputs:
      detection_conclusion: ${{ steps.fixture.outputs.conclusion }}
      detection_reason: "Controlled fixture data, not model output"
      aic: "0"
    steps:
      - id: fixture
        run: echo "conclusion=success" >> "$GITHUB_OUTPUT"
  safe_outputs:
    needs:
      - activation
      - agent
      - detection
    if: (!cancelled()) && needs.agent.result != 'skipped' && needs.detection.result == 'success'
    runs-on: ubuntu-slim
    permissions:
      actions: write
      issues: write
      pull-requests: write
    timeout-minutes: 45
    env:
      GH_AW_AGENT_AIC: ${{ needs.agent.outputs.aic }}
      GH_AW_AIC: ${{ needs.agent.outputs.aic }}
      GH_AW_AMBIENT_CONTEXT: ${{ needs.agent.outputs.ambient_context }}
      GH_AW_CALLER_WORKFLOW_ID: "${{ github.repository }}/issue-triage"
      GH_AW_DETECTION_CONCLUSION: ${{ needs.detection.outputs.detection_conclusion }}
      GH_AW_DETECTION_REASON: ${{ needs.detection.outputs.detection_reason }}
      GH_AW_EFFECTIVE_TOKENS: ${{ needs.agent.outputs.effective_tokens }}
      GH_AW_ENGINE_ID: "copilot"
      GH_AW_ENGINE_MODEL: ${{ needs.agent.outputs.model }}
      GH_AW_RUNTIME_FEATURES: ${{ vars.GH_AW_RUNTIME_FEATURES }}
      GH_AW_THREAT_DETECTION_AIC: ${{ needs.detection.outputs.aic }}
      GH_AW_WORKFLOW_ID: "issue-triage"
      GH_AW_WORKFLOW_NAME: "Agentic Triage"
      GH_AW_WORKFLOW_SOURCE_URL: "${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/.github/workflows/issue-triage.md"
    outputs:
      assign_to_user_assigned: ${{ steps.process_safe_outputs.outputs.assigned }}
      code_push_failure_count: ${{ steps.process_safe_outputs.outputs.code_push_failure_count }}
      code_push_failure_errors: ${{ steps.process_safe_outputs.outputs.code_push_failure_errors }}
      comment_id: ${{ steps.process_safe_outputs.outputs.comment_id }}
      comment_url: ${{ steps.process_safe_outputs.outputs.comment_url }}
      create_discussion_error_count: ${{ steps.process_safe_outputs.outputs.create_discussion_error_count }}
      create_discussion_errors: ${{ steps.process_safe_outputs.outputs.create_discussion_errors }}
      process_safe_outputs_items_applied: ${{ steps.process_safe_outputs.outputs.items_applied }}
      process_safe_outputs_items_cancelled: ${{ steps.process_safe_outputs.outputs.items_cancelled }}
      process_safe_outputs_items_deferred: ${{ steps.process_safe_outputs.outputs.items_deferred }}
      process_safe_outputs_items_failed: ${{ steps.process_safe_outputs.outputs.items_failed }}
      process_safe_outputs_items_skipped: ${{ steps.process_safe_outputs.outputs.items_skipped }}
      process_safe_outputs_items_succeeded: ${{ steps.process_safe_outputs.outputs.items_succeeded }}
      process_safe_outputs_items_warnings: ${{ steps.process_safe_outputs.outputs.items_warnings }}
      process_safe_outputs_processed_count: ${{ steps.process_safe_outputs.outputs.processed_count }}
      process_safe_outputs_status: ${{ steps.process_safe_outputs.outputs.status }}
      process_safe_outputs_temporary_id_map: ${{ steps.process_safe_outputs.outputs.temporary_id_map }}
    steps:
      - name: Setup Scripts
        id: setup
        uses: github/gh-aw-actions/setup@5e508589e03a7757a7e05b26e834292f5445bfb6 # v0.88.8
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
          job-name: ${{ github.job }}
          trace-id: ${{ needs.activation.outputs.setup-trace-id }}
          parent-span-id: ${{ needs.activation.outputs.setup-parent-span-id || needs.activation.outputs.setup-span-id }}
        env:
          GH_AW_SETUP_WORKFLOW_NAME: "Agentic Triage"
          GH_AW_CURRENT_WORKFLOW_REF: ${{ github.repository }}/.github/workflows/issue-triage.lock.yml@${{ github.ref }}
          GH_AW_INFO_VERSION: "1.0.80"
          GH_AW_INFO_AWF_VERSION: "v0.28.14"
          GH_AW_INFO_ENGINE_ID: "copilot"
      - name: Mask OTLP telemetry headers
        run: bash "${RUNNER_TEMP}/gh-aw/actions/mask_otlp_headers.sh"
      - name: Download agent output artifact
        id: download-agent-output
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{agent,agent-output-fallback}"
          merge-multiple: true
          path: /tmp/gh-aw/
      - name: Setup agent output environment variable
        id: setup-agent-output-env
        if: steps.download-agent-output.outcome == 'success'
        run: |
          mkdir -p /tmp/gh-aw/
          find "/tmp/gh-aw/" -type f -print
          if [ -f "/tmp/gh-aw/agent_output.json" ]; then
            echo "GH_AW_AGENT_OUTPUT=/tmp/gh-aw/agent_output.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure GH_HOST for enterprise compatibility
        id: ghes-host-config
        shell: bash
        run: | # zizmor: ignore[github-env] - GITHUB_SERVER_URL is set by GitHub Actions, not user input.
          # Derive GH_HOST from GITHUB_SERVER_URL so the gh CLI targets the correct
          # GitHub instance (GHES/GHEC). On github.com this is a harmless no-op.
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          GH_HOST="${GH_HOST#http://}"
          echo "GH_HOST=${GH_HOST}" >> "$GITHUB_ENV"
      - name: Defer investigation dispatch until triage is applied
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
        with:
          script: |
            const fs = require('node:fs');
            const file = process.env.GH_AW_AGENT_OUTPUT;
            const output = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (!Array.isArray(output.items)) {
              throw new Error('Agent output is missing the items array');
            }
            const count = output.items.length;
            output.items = output.items.filter(item =>
              item.type !== 'dispatch_workflow' && item.type !== 'issue_investigation'
            );
            fs.writeFileSync(file, JSON.stringify(output));
            core.info(`Deferred ${count - output.items.length} buffered investigation dispatches`);
      - name: Process Safe Outputs
        id: process_safe_outputs
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_AGENT_OUTPUT: ${{ steps.setup-agent-output-env.outputs.GH_AW_AGENT_OUTPUT }}
          GH_AW_COMMENT_ID: ${{ needs.activation.outputs.comment_id }}
          GH_AW_ALLOWED_DOMAINS: "*.githubusercontent.com,*.in.applicationinsights.azure.com,*.pythonhosted.org,anaconda.org,api.snapcraft.io,archive.ubuntu.com,azure.archive.ubuntu.com,binstar.org,bootstrap.pypa.io,codeload.github.com,conda.anaconda.org,conda.binstar.org,crl.geotrust.com,crl.globalsign.com,crl.identrust.com,crl.sectigo.com,crl.thawte.com,crl.usertrust.com,crl.verisign.com,crl3.digicert.com,crl4.digicert.com,crls.ssl.com,docs.github.com,files.pythonhosted.org,github-cloud.githubusercontent.com,github-cloud.s3.amazonaws.com,github.blog,github.com,github.githubassets.com,json-schema.org,json.schemastore.org,keyserver.ubuntu.com,lfs.github.com,objects.githubusercontent.com,ocsp.digicert.com,ocsp.geotrust.com,ocsp.globalsign.com,ocsp.identrust.com,ocsp.sectigo.com,ocsp.ssl.com,ocsp.thawte.com,ocsp.usertrust.com,ocsp.verisign.com,packagecloud.io,packages.cloud.google.com,packages.microsoft.com,patch-diff.githubusercontent.com,patchdiff.githubusercontent.com,pip.pypa.io,ppa.launchpad.net,pypi.org,pypi.python.org,raw.githubusercontent.com,repo.anaconda.com,repo.continuum.io,s.symcb.com,s.symcd.com,security.ubuntu.com,ts-crl.ws.symantec.com,ts-ocsp.ws.symantec.com,www.googleapis.com"
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_API_URL: ${{ github.api_url }}
          GH_AW_SAFE_OUTPUT_JOBS: "{\"mention_owners\":\"\"}"
          GH_AW_SAFE_OUTPUTS_HANDLER_CONFIG: "{\"add_comment\":{\"max\":2,\"target\":\"*\"},\"add_labels\":{\"max\":7,\"target\":\"*\"},\"assign_to_user\":{\"max\":1,\"target\":\"*\"},\"create_report_incomplete_issue\":{},\"dispatch_workflow\":{\"allowed_refs\":[\"refs/heads/${{ github.event.repository.default_branch }}\"],\"aw_context_workflows\":[\"issue-investigation\"],\"max\":1,\"workflow_files\":{\"issue-investigation\":\".lock.yml\"},\"workflows\":[\"issue-investigation\"]},\"missing_data\":{},\"missing_tool\":{},\"noop\":{\"max\":1,\"report-as-issue\":\"false\"},\"remove_labels\":{\"max\":7,\"target\":\"*\"},\"report_incomplete\":{}}"
        with:
          github-token: ${{ secrets.GH_AW_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const path = require('path');
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            const { setupGlobals } = require(path.join(actionsDir, 'setup_globals.cjs'));
            setupGlobals(core, github, context, exec, io, getOctokit);
            const { main } = require(path.join(actionsDir, 'process_safe_outputs.cjs'));
            await main();
      - name: Upload Safe Outputs Items
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: safe-outputs-items
          path: |
            /tmp/gh-aw/safe-output-items.jsonl
            /tmp/gh-aw/temporary-id-map.json
            /tmp/gh-aw/safe-output-errors.json
          if-no-files-found: ignore
  mention_owners:
    needs:
      - agent
      - detection
      - safe_outputs
    if: >
      (!cancelled()) && needs.agent.result != 'skipped' && contains(needs.agent.outputs.output_types, 'mention_owners') &&
      (needs.agent.result == 'success' && needs.detection.result == 'success' && needs.detection.outputs.detection_conclusion == 'success' &&
      needs.safe_outputs.result == 'success' && needs.safe_outputs.outputs.process_safe_outputs_status == 'success' &&
      fromJSON(needs.safe_outputs.outputs.process_safe_outputs_items_applied || '0') > 0 && needs.safe_outputs.outputs.comment_id != '')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Download agent output artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "{agent,agent-output-fallback}"
          merge-multiple: true
          path: ${{ runner.temp }}/gh-aw/safe-jobs/
      - name: Post mention comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DISPATCH_ISSUE_NUMBER: ${{ github.event.inputs.issue_number || '' }}
          GH_AW_AGENT_OUTPUT: ${{ runner.temp }}/gh-aw/safe-jobs/agent_output.json
        with:
          script: |
            const fs = require('fs');
            const outputFile = process.env.GH_AW_AGENT_OUTPUT;

            function resolveIssueNumber() {
              if (Number.isInteger(context.issue?.number) && context.issue.number > 0) {
                return context.issue.number;
              }
              const parsed = parseInt(process.env.DISPATCH_ISSUE_NUMBER, 10);
              if (Number.isInteger(parsed) && parsed > 0) {
                return parsed;
              }
              return null;
            }

            const issueNumber = resolveIssueNumber();
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            if (issueNumber === null) {
              core.setFailed(`Unable to determine a valid issue number. context.issue.number=${context.issue?.number ?? 'undefined'}, DISPATCH_ISSUE_NUMBER=${process.env.DISPATCH_ISSUE_NUMBER ?? 'undefined'}`);
              return;
            }

            async function failSafe(reason) {
              core.error(`mention_owners failed: ${reason}`);
              try {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: issueNumber,
                  labels: ['needs-team-triage']
                });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issueNumber,
                  body: '⚠️ Automated triage was unable to complete owner notification for this issue. Routing for manual triage'
                });
              } catch (recoveryError) {
                core.error(`Recovery also failed: ${recoveryError.message}`);
              }
              core.setFailed(reason);
            }

            if (!outputFile) {
              await failSafe('No agent output path provided');
              return;
            }
            if (!fs.existsSync(outputFile)) {
              await failSafe(`Agent output file not found: ${outputFile}`);
              return;
            }

            let agentOutput;
            try {
              agentOutput = JSON.parse(fs.readFileSync(outputFile, 'utf8'));
            } catch (parseError) {
              await failSafe(`Failed to parse agent output: ${parseError.message}`);
              return;
            }

            if (!agentOutput || !Array.isArray(agentOutput.items)) {
              await failSafe('Agent output missing items array');
              return;
            }

            const items = agentOutput.items.filter(i => i.type === 'mention_owners');
            if (items.length === 0) {
              await failSafe('No mention_owners items in agent output');
              return;
            }

            // Neutralize '@' in the agent-produced message so only the validated
            // owners drive the //cc mentions. This is the one write path that
            // bypasses safe-outputs sanitization, so the free-text message must
            // not be able to smuggle its own (unvalidated) mentions.
            function sanitizeMessage(message) {
              if (typeof message !== 'string') return '';
              return message.replace(/@/g, '@\u200B').trim();
            }

            for (const item of items) {
              if (!item.owners || typeof item.owners !== 'string' || !item.owners.trim()) {
                await failSafe('mention_owners item missing owners field');
                return;
              }

              const mentions = item.owners
                .split(/[\s,]+/)
                .map(s => s.trim())
                .filter(Boolean)
                .map(raw => {
                  const normalized = raw.replace(/^\\?@/, '');
                  if (/\r|\n/.test(normalized)) return null;
                  if (!/^[A-Za-z0-9-]+(?:\/[A-Za-z0-9-]+)?$/.test(normalized)) return null;
                  return `@${normalized}`;
                })
                .filter(Boolean);

              if (mentions.length === 0) {
                await failSafe('No valid owners after parsing owners field');
                return;
              }

              const safeMessage = sanitizeMessage(item.message);
              const body = safeMessage
                ? `${safeMessage}\n\n//cc: ${mentions.join(' ')}`
                : mentions.join(' ');

              try {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issueNumber,
                  body
                });
                core.info(`Posted routing comment on #${issueNumber} mentioning: ${mentions.join(', ')}`);
              } catch (apiError) {
                await failSafe(`GitHub API error posting comment: ${apiError.message}`);
                return;
              }
            }
  investigation_handoff:
    needs:
      - agent
      - detection
      - mention_owners
      - safe_outputs
    if: >
      !cancelled() && needs.agent.result == 'success' && needs.detection.result == 'success' && needs.detection.outputs.detection_conclusion == 'success' &&
      needs.safe_outputs.result == 'success' && needs.safe_outputs.outputs.process_safe_outputs_status == 'success' &&
      fromJSON(needs.safe_outputs.outputs.process_safe_outputs_items_applied || '0') > 0 && needs.safe_outputs.outputs.comment_id != '' &&
      needs.mention_owners.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      issues: read
    steps:
      - name: Configure GH_HOST for enterprise compatibility
        id: ghes-host-config
        shell: bash
        run: | # zizmor: ignore[github-env] - GITHUB_SERVER_URL is set by GitHub Actions, not user input.
          # Derive GH_HOST from GITHUB_SERVER_URL so the gh CLI targets the correct
          # GitHub instance (GHES/GHEC). On github.com this is a harmless no-op.
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          GH_HOST="${GH_HOST#http://}"
          echo "GH_HOST=${GH_HOST}" >> "$GITHUB_ENV"
      - name: Checkout trusted handoff helper
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: triage-handoff
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          sparse-checkout: .github/workflows/scripts
      - name: Setup native safe-output processor
        uses: github/gh-aw-actions/setup@5e508589e03a7757a7e05b26e834292f5445bfb6 # v0.88.8
        with:
          destination: ${{ runner.temp }}/gh-aw/actions
      - name: Validate applied triage and dispatch investigation
        id: handoff
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          GH_AW_CALLER_WORKFLOW_ID: ${{ github.repository }}/issue-triage
          GH_AW_DETECTION_CONCLUSION: ${{ needs.detection.outputs.detection_conclusion }}
          GH_AW_WORKFLOW_ID: issue-triage
          GH_AW_WORKFLOW_NAME: Agentic Triage
          TRIAGE_COMMENT_ID: ${{ needs.safe_outputs.outputs.comment_id }}
          TRIAGE_ISSUE_NUMBER: ${{ github.event.issue.number || github.event.inputs.issue_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const helper = require(path.join(
              process.env.GITHUB_WORKSPACE, 'triage-handoff',
              '.github', 'workflows', 'scripts', 'issue_investigation_handoff.cjs'
            ));
            const handoff = await helper.prepareHandoff({
              github, context,
              issueNumber: process.env.TRIAGE_ISSUE_NUMBER,
              commentId: process.env.TRIAGE_COMMENT_ID
            });
            if (!handoff.output) {
              core.notice(`Investigation handoff skipped: ${handoff.reason}`);
              return;
            }
            const file = path.join(process.env.RUNNER_TEMP, 'investigation-handoff.json');
            fs.writeFileSync(file, JSON.stringify(handoff.output));
            core.setOutput('dispatch_requested', 'true');
            process.env.GH_AW_AGENT_OUTPUT = file;
            process.env.GH_AW_SAFE_OUTPUTS_HANDLER_CONFIG = JSON.stringify(handoff.config);
            const actionsDir = path.join(process.env.RUNNER_TEMP, 'gh-aw', 'actions');
            require(path.join(actionsDir, 'setup_globals.cjs'))
              .setupGlobals(core, github, context, exec, io, getOctokit);
            await require(path.join(actionsDir, 'process_safe_outputs.cjs')).main();
      - name: Confirm investigation dispatch succeeded
        if: steps.handoff.outputs.dispatch_requested == 'true' && (steps.handoff.outputs.status != 'success' || steps.handoff.outputs.items_applied != '1')
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: core.setFailed('The native safe-output processor did not apply the investigation dispatch');
